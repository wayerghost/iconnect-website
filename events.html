<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-Connect Student Society</title>
    <meta name="description"
        content="Official website of i-Connect Student Society. Bridging the gap between theory and practice through innovation and community.">
    <link href="./dist/output.css?v=2" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <script src="components.js?v=2" defer></script>
    <script src="script.js?v=6" defer></script>
    <script src="events.js" defer></script>
</head>

<body class="bg-[#051923] text-[#f8f9fa] font-poppins selection:bg-accent/30 overflow-x-hidden">

    <!-- Header / Navbar -->
    <ic-header></ic-header>

    <main class="min-h-screen pt-32 pb-16 relative z-10">
        <!-- Ambient background glow elements -->
        <div class="absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] bg-[#1b75bc]/10 blur-[120px] rounded-full pointer-events-none -z-10"></div>
        <div class="absolute bottom-1/3 right-1/4 translate-x-1/2 translate-y-1/2 w-[300px] h-[300px] bg-[#5abeb0]/10 blur-[120px] rounded-full pointer-events-none -z-10"></div>

        <div class="max-w-7xl mx-auto px-6">
            <!-- Header Section -->
            <div class="text-center mb-12 animate-fade-in-up">
                <div class="relative inline-block mb-4">
                    <span class="absolute inset-0 select-none font-poppins text-4xl md:text-6xl font-extrabold text-[#75BBF0] blur-md opacity-40 tracking-tight" aria-hidden="true">
                        Events Calendar
                    </span>
                    <h1 class="relative font-poppins text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#75BBF0] via-[#FFFFFF] to-[#30D3D0] tracking-tight">
                        Events Calendar
                    </h1>
                </div>
                <p class="text-gray-400 text-sm sm:text-base max-w-xl mx-auto font-medium mt-2 leading-relaxed">
                    Stay updated with all upcoming seminars, workshops, and competitions of the i-Connect Student Society.
                </p>
            </div>

            <!-- Categories Filter -->
            <div class="flex flex-wrap items-center justify-center gap-3 mb-10 animate-fade-in-up delay-1">
                <button data-filter="all" class="filter-btn active px-5 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider border border-white/10 bg-white/5 hover:bg-white/10 text-white transition-all cursor-pointer shadow-md select-none">
                    All Events
                </button>
                <button data-filter="seminar" class="filter-btn px-5 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider border border-[#75BBF0]/20 bg-white/5 hover:bg-[#75BBF0]/10 text-gray-300 hover:text-white transition-all cursor-pointer shadow-md select-none flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#75BBF0] shadow-[0_0_8px_#75BBF0]"></span>
                    Seminars
                </button>
                <button data-filter="workshop" class="filter-btn px-5 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider border border-[#5abeb0]/20 bg-white/5 hover:bg-[#5abeb0]/10 text-gray-300 hover:text-white transition-all cursor-pointer shadow-md select-none flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#5abeb0] shadow-[0_0_8px_rgba(90,190,176,0.8)]"></span>
                    Workshops
                </button>
                <button data-filter="competition" class="filter-btn px-5 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider border border-[#a855f7]/20 bg-white/5 hover:bg-[#a855f7]/10 text-gray-300 hover:text-white transition-all cursor-pointer shadow-md select-none flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#a855f7] shadow-[0_0_8px_rgba(168,85,247,0.8)]"></span>
                    Competitions
                </button>
                <button data-filter="meeting" class="filter-btn px-5 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider border border-white/10 bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white transition-all cursor-pointer shadow-md select-none flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-white shadow-[0_0_8px_rgba(255,255,255,0.8)]"></span>
                    Meetings
                </button>
            </div>

            <!-- Calendar & Info Section Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-16 animate-fade-in-up delay-2">
                <!-- Left: Calendar (col-span-7) -->
                <div class="lg:col-span-7 flex flex-col gap-6">
                    <div class="glass-card rounded-[2rem] border border-white/10 p-6 sm:p-8 flex flex-col shadow-2xl relative overflow-hidden">
                        <!-- Decorative background elements inside card -->
                        <div class="absolute -top-12 -right-12 w-36 h-36 bg-[#5abeb0]/5 blur-3xl rounded-full"></div>
                        <div class="absolute -bottom-12 -left-12 w-36 h-36 bg-[#1b75bc]/5 blur-3xl rounded-full"></div>

                        <!-- Calendar Header (Month Selector) -->
                        <div class="flex items-center justify-between mb-8 relative z-10">
                            <button id="prev-month" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white transition-all cursor-pointer active:scale-95">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                                </svg>
                            </button>
                            <h2 id="current-month-year" class="text-xl sm:text-2xl font-bold text-white tracking-wide text-glow-white">
                                June 2026
                            </h2>
                            <button id="next-month" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white transition-all cursor-pointer active:scale-95">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                                </svg>
                            </button>
                        </div>

                        <!-- Calendar Grid -->
                        <div class="relative z-10">
                            <!-- Weekdays Header -->
                            <div class="grid grid-cols-7 text-center font-bold text-xs tracking-wider text-gray-400 mb-4 select-none">
                                <div>SUN</div>
                                <div>MON</div>
                                <div>TUE</div>
                                <div>WED</div>
                                <div>THU</div>
                                <div>FRI</div>
                                <div>SAT</div>
                            </div>
                            <!-- Days Grid -->
                            <div id="calendar-days" class="grid grid-cols-7 gap-2 min-h-[280px]">
                                <!-- Dynamically generated by events.js -->
                            </div>
                        </div>

                        <!-- Calendar Legend -->
                        <div class="border-t border-white/5 pt-6 mt-8 grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs font-semibold tracking-wider text-gray-400 relative z-10">
                            <div class="flex items-center gap-2 justify-center sm:justify-start">
                                <span class="w-2.5 h-2.5 rounded-full bg-[#75BBF0] shadow-[0_0_8px_#75BBF0]"></span>
                                <span>Seminars</span>
                            </div>
                            <div class="flex items-center gap-2 justify-center sm:justify-start">
                                <span class="w-2.5 h-2.5 rounded-full bg-[#5abeb0] shadow-[0_0_8px_rgba(90,190,176,0.8)]"></span>
                                <span>Workshops</span>
                            </div>
                            <div class="flex items-center gap-2 justify-center sm:justify-start">
                                <span class="w-2.5 h-2.5 rounded-full bg-[#a855f7] shadow-[0_0_8px_rgba(168,85,247,0.8)]"></span>
                                <span>Competitions</span>
                            </div>
                            <div class="flex items-center gap-2 justify-center sm:justify-start">
                                <span class="w-2.5 h-2.5 rounded-full bg-white shadow-[0_0_8px_rgba(255,255,255,0.8)]"></span>
                                <span>Meetings</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Selected Event Details & Upcoming (col-span-5) -->
                <div class="lg:col-span-5 flex flex-col gap-6">
                    <!-- Selected Event Card -->
                    <div id="selected-event-panel" class="glass-card rounded-[2rem] border border-white/10 p-6 sm:p-8 flex flex-col shadow-2xl relative overflow-hidden min-h-[300px]">
                        <!-- Dynamically filled by events.js -->
                    </div>

                    <!-- Upcoming Events Feed -->
                    <div class="glass-card rounded-[2rem] border border-white/10 p-6 sm:p-8 flex flex-col shadow-2xl relative overflow-hidden">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-lg font-bold text-white tracking-wide">Upcoming Feed</h3>
                            <span id="upcoming-count" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-white/5 border border-white/10 text-[#75BBF0]">3 Events</span>
                        </div>
                        <div id="upcoming-events-list" class="flex flex-col gap-4 max-h-[300px] overflow-y-auto pr-1">
                            <!-- Dynamically filled by events.js -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <!-- Footer -->
    <ic-footer></ic-footer>
</body>

</html>
